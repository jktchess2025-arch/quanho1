name: Deploy Quan Ho website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "quan-ho-journey/**"
      - "*.jpg"
      - "*.webp"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: quan-ho-journey/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: quan-ho-journey
        run: pnpm install --frozen-lockfile

      - name: Build Vite frontend
        working-directory: quan-ho-journey
        run: pnpm exec vite build --base=/quanho1/

      - name: Copy original website images
        run: |
          mkdir -p quan-ho-journey/dist/public/images
          cp quan-ho-singers.jpg quan-ho-journey/dist/public/images/quan-ho-singers.jpg
          cp di-san-van-hoa-la-gi-9.webp quan-ho-journey/dist/public/images/di-san-van-hoa-la-gi-9.webp
          cp hatquanho.jpg quan-ho-journey/dist/public/images/hatquanho.jpg
          cp images.jpg quan-ho-journey/dist/public/images/images.jpg
          cp quan-ho-journey/client/public/images/vietnam-map.webp quan-ho-journey/dist/public/images/vietnam-map.webp

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: quan-ho-journey/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
